<!DOCTYPE html>
<html lang="ja" data-theme="light" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>キャンプサイト完全ガイド</title>
<link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=M+PLUS+Rounded+1c:wght@500;700;800&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
        .slide-container {
            width: 1280px;
            min-height: 720px;
            position: relative;
            font-family: 'Noto Sans JP', sans-serif;
        }
        .slide-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            z-index: 0;
        }
        .slide-content {
            position: relative;
            z-index: 1;
            height: 100%;
            color: white;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.8);
        }
        .title {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            font-weight: 800;
        }
        .icon-badge {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body style="">
<div class="slide-container">
<!-- 背景画像 -->
<img alt="湖畔キャンプサイト" class="slide-bg" src="https://page.gensparksite.com/slides_images/11ad0275c4cf5ed279106ceea874d195.jpg" data-height-listener-added="true">
<div class="overlay"></div>
<!-- スライドコンテンツ -->
<div class="slide-content flex flex-col justify-center items-center p-12">
<div class="icon-badge">
<i class="fas fa-campground text-green-800 text-4xl"></i>
</div>
<h1 class="title text-6xl mb-6 text-center">キャンプサイト完全ガイド</h1>
<p class="text-xl mb-10 text-center">
                これからキャンプを始めたい方、レベルアップしたい方必見！<br>
                キャンプサイトの種類や選び方、設備、マナー、予約までトータル解説。
            </p>
<div class="flex justify-center items-center space-x-4 mt-6">
<span class="bg-white bg-opacity-30 px-4 py-1 rounded-full text-sm">
<i class="fas fa-tree mr-2"></i>初心者から上級者まで
                </span>
<span class="bg-white bg-opacity-30 px-4 py-1 rounded-full text-sm">
<i class="fas fa-map-marker-alt mr-2"></i>サイト選びのコツ
                </span>
<span class="bg-white bg-opacity-30 px-4 py-1 rounded-full text-sm">
<i class="fas fa-calendar-alt mr-2"></i>2025年版
                </span>
</div>
</div>
</div>

</body></html>
